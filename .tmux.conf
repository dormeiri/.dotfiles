set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"
set -g mouse on
setw -g mode-keys vi

set -g focus-events on
set -sg escape-time 0
set -g history-limit 50000
set -g renumber-windows on
set -g set-clipboard on

# Start windows and panes at 1, not 0
set -g base-index 1
setw -g pane-base-index 1

%hidden AGENT_MODEL="claude-opus-5-5-medium"
%hidden ASK_MODEL="claude-sonnet-5-5-medium"
%hidden SCRIPTS="$HOME/.dotfiles/scripts"

# rebind prefix to Ctrl-a
unbind C-b
set -g prefix 'C-a'
bind C-a send-prefix

bind "r" source-file ~/.tmux.conf \; display "reloaded"

# bind vim copy keys
bind-key -Tcopy-mode-vi 'v' send -X begin-selection
bind-key -Tcopy-mode-vi 'y' send -X copy-pipe-and-cancel "pbcopy"

# nicer new window
bind 'c' new-window -c "#{pane_current_path}"

# splits
unbind '"'
unbind '%'
bind "|" split-window -h -c "#{pane_current_path}"
bind "-" split-window -v -c "#{pane_current_path}"
bind "O" display-popup -h "90%" -w "90%" -d "$HOME" -E 'tmux new-session yazi \; set status off'
bind "o" display-popup -h "90%" -w "90%" -d "#{pane_current_path}" -E 'tmux new-session yazi \; set status off'
bind "t" display-popup -w "90%" -h "90%" -d "#{pane_current_path}" -E "gh dash"
bind "f" display-popup -w "90%" -h "90%" -d "#{pane_current_path}" -E "$HOME/dev/dormeiri/flow/src/main.ts"
bind "p" run-shell -b -c "#{pane_current_path}" "gh pr view -w >/dev/null 2>&1 || tmux display 'No PR for this branch'"
bind "g" display-popup -w "90%" -h "90%" -d "#{pane_current_path}" -E "$SCRIPTS/git-ship.sh"
bind "G" display-popup -w "90%" -h "90%" -d "#{pane_current_path}" -E "$SCRIPTS/git-ship.sh --all"
bind "\\" split-window -h -c "#{pane_current_path}" "cursor-agent --model=$AGENT_MODEL"
bind "?" split-window -h -c "#{pane_current_path}" "cursor-agent --mode=ask --model=$ASK_MODEL"
bind "e" split-window -h -c "#{pane_current_path}" $EDITOR
bind "]" run-shell -b "$SCRIPTS/tmux-edit-scrollback.sh '#{pane_id}'"

# pane navigation
bind -n M-k select-pane -U
bind -n M-j select-pane -D
bind -n M-h select-pane -L
bind -n M-l select-pane -R

# pane resizing
bind-key -r -T prefix C-k resize-pane -U 5
bind-key -r -T prefix C-j resize-pane -D 5
bind-key -r -T prefix C-h resize-pane -L 5
bind-key -r -T prefix C-l resize-pane -R 5

# window navigation
bind -n M-1     select-window -t 1
bind -n M-2     select-window -t 2
bind -n M-3     select-window -t 3
bind -n M-4     select-window -t 4
bind -n M-5     select-window -t 5
bind -n M-6     select-window -t 6
bind -n M-7     select-window -t 7
bind -n M-8     select-window -t 8
bind -n M-9     select-window -t 9
bind -n M-Tab   next-window
bind a          set-window-option synchronize-panes

# Undercurl
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'  # undercurl support
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'  # underscore colours - needs tmux-3.0

# popups
set -g popup-style default
set -g popup-border-style "fg=#a6adc8"
set -g popup-border-lines rounded

# status bar
set -g status-bg "#11111b"
set -g status-fg white
set -g window-status-format "#[fg=#a6adc8] #I "
set -g window-status-current-format "#[bold,bg=#1e1e2e,fg=#bac2de] #I "
set -g status-right "#[fg=#a6adc8] \uf455 #($HOME/.dotfiles/scripts/cal.sh | cut -c1-27 | awk '{$1=$1};1') #[bold,bg=#a6e3a1,fg=#11111b] \uf43a %H:%M "
set -g status-left-length 0
set -g status-left ""
